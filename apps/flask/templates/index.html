<!DOCTYPE html>
<html>

<head>
    <title>GeoHazard Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #eef2f3, #ffffff);
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            border-radius: 15px;
            border: none;
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.1);
        }

        .map-container {
            border-radius: 12px;
            overflow: hidden;
        }

        .btn-primary {
            border-radius: 10px;
        }

        .card:hover {
            transform: translateY(-3px);
            transition: 0.3s;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand">🌍 GeoHazard ML</span>
        </div>
    </nav>

    <div class="container mt-4">

        <!-- HEADER -->
        <div class="text-center mb-4">
            <h1 class="fw-bold">Geo Hazard Prediction System</h1>
            <p class="text-muted">
                Analyze global risk and predict hazard levels using ML
            </p>
        </div>

        <!-- HEATMAP -->
        <div class="card p-3 mb-4">
            <h5>🌍 Global Risk Heatmap</h5>
            <div class="map-container">
                {{ map_html | safe }}
            </div>
        </div>

        <!-- FORM -->
        <div class="card p-4">

            <h5 class="mb-3">⚙️ Enter Parameters</h5>

            <form action="/predict" method="post">

                <div class="row">

                    <!-- LEFT -->
                    <div class="col-md-6">
                        <label>Earthquake Count</label>
                        <input class="form-control mb-2" name="eq_count">

                        <label>Avg Magnitude</label>
                        <input class="form-control mb-2" name="eq_mag_mean">

                        <label>Avg Depth</label>
                        <input class="form-control mb-2" name="eq_depth_mean">

                        <label>Seismic Activity</label>
                        <select class="form-select mb-2" name="has_seismic_activity">
                            <option value="1">Yes</option>
                            <option value="0">No</option>
                        </select>

                        <label>Frequency Score</label>
                        <input class="form-control mb-2" name="eq_frequency_score">
                    </div>

                    <!-- RIGHT -->
                    <div class="col-md-6">
                        <label>Seismic Energy</label>
                        <input class="form-control mb-2" name="seismic_energy_proxy">

                        <label>Mag/Depth Ratio</label>
                        <input class="form-control mb-2" name="mag_depth_ratio">

                        <label>Depth Category</label>
                        <select class="form-select mb-2" name="depth_category">
                            <option value="0">Shallow</option>
                            <option value="1">Medium</option>
                            <option value="2">Deep</option>
                        </select>

                        <label>Latitude</label>
                        <input class="form-control mb-2" name="lat_abs">

                        <label>Longitude</label>
                        <input class="form-control mb-2" name="lon">

                        <label>Neighbor EQ Count</label>
                        <input class="form-control mb-2" name="neighbor_eq_count">
                    </div>

                </div>

                <hr>

                <label>Select Model</label>
                <select class="form-select mb-3" name="model">
                    <option value="rf">Random Forest</option>
                    <option value="xgb">XGBoost</option>
                </select>

                <button class="btn btn-primary btn-lg w-100">
                    🔍 Predict Risk
                </button>

            </form>

        </div>

    </div>

</body>

</html>
