<!DOCTYPE html>
<html>
<head>
    <title>GeoHazard Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #eef2f3, #ffffff); font-family: 'Segoe UI', sans-serif; }
        .card { border-radius: 15px; border: none; box-shadow: 0px 4px 20px rgba(0,0,0,0.1); }
        .map-container { border-radius: 12px; overflow: hidden; }
        .btn-primary { border-radius: 10px; }
        .card:hover { transform: translateY(-3px); transition: 0.3s; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container"><span class="navbar-brand">🌍 GeoHazard ML</span></div>
    </nav>

    <div class="container mt-4">

        <div class="text-center mb-4">
            <h1 class="fw-bold">Geo Hazard Prediction System</h1>
            <p class="text-muted">Analyze global risk and predict hazard levels using ML</p>
        </div>

        <!-- HEATMAP -->
        <div class="card p-3 mb-4">
            <h5>🌍 Global Risk Heatmap</h5>
            <div class="map-container">{{ map_html | safe }}</div>
        </div>

        <!-- FORM -->
        <div class="card p-4">
            <h5 class="mb-3">⚙️ Enter Parameters</h5>

            <form action="/predict" method="post">
                <div class="row">

                    <!-- LEFT -->
                    <div class="col-md-6">
                        <label>Earthquake Count</label>
                        <input class="form-control mb-2" name="eq_count" type="number" step="1" min="0" value="0">

                        <label>Avg Magnitude</label>
                        <input class="form-control mb-2" name="eq_mag_mean" type="number" step="0.1" value="0.0">

                        <label>Avg Depth (km)</label>
                        <input class="form-control mb-2" name="eq_depth_mean" type="number" step="0.1" value="0.0">

                        <label>Seismic Activity</label>
                        <select class="form-select mb-2" name="has_seismic_activity">
                            <option value="1">Yes</option>
                            <option value="0">No</option>
                        </select>

                        <label>Frequency Score</label>
                        <input class="form-control mb-2" name="eq_frequency_score" type="number" step="0.01" value="0.0">

                        <label>Continent</label>
                        <select class="form-select mb-2" name="continent">
                            {% for c in continents %}
                            <option value="{{ c }}">{{ c }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- RIGHT -->
                    <div class="col-md-6">
                        <label>Seismic Energy Proxy</label>
                        <input class="form-control mb-2" name="seismic_energy_proxy" type="number" step="1" value="0">

                        <label>Mag / Depth Ratio</label>
                        <input class="form-control mb-2" name="mag_depth_ratio" type="number" step="0.01" value="0.0">

                        <label>Depth Category</label>
                        <select class="form-select mb-2" name="depth_category">
                            <option value="0">0 — No data / No quake</option>
                            <option value="1">1 — Shallow (&lt; 70 km)</option>
                            <option value="2">2 — Intermediate (70–300 km)</option>
                            <option value="3">3 — Deep (&gt; 300 km)</option>
                        </select>

                        <label>Absolute Latitude (0–90)</label>
                        <input class="form-control mb-2" name="lat_abs" type="number" step="0.1" min="0" max="90" value="0.0">

                        <label>Longitude (-180 to 180)</label>
                        <input class="form-control mb-2" name="lon" type="number" step="0.1" min="-180" max="180" value="0.0">

                        <label>Neighbour EQ Count</label>
                        <input class="form-control mb-2" name="neighbor_eq_count" type="number" step="0.1" value="0.0">
                    </div>

                </div>

                <hr>

                <label>Select Model</label>
                <select class="form-select mb-3" name="model">
                    <option value="xgb">XGBoost (recommended)</option>
                    <option value="rf">Random Forest</option>
                </select>

                <button class="btn btn-primary btn-lg w-100">🔍 Predict Risk</button>

            </form>
        </div>

    </div>
</body>
</html>
