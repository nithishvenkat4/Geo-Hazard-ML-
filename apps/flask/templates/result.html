<!DOCTYPE html>
<html>

<head>
    <title>Prediction Result</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <style>
        body {
            background: linear-gradient(135deg, #eef2f3, #ffffff);
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            border-radius: 15px;
            border: none;
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.1);
        }

        #map {
            height: 400px;
            border-radius: 12px;
        }

        .risk-high {
            color: red;
        }

        .risk-medium {
            color: orange;
        }

        .risk-low {
            color: green;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand">🌍 GeoHazard ML</span>
        </div>
    </nav>

    <div class="container mt-4 mb-5">

        <h1 class="text-center mb-2">📊 Prediction Result</h1>
        <p class="text-center text-muted">
            Model prediction based on your inputs
        </p>

        <div class="row mt-4">

            <!-- RESULT -->
            <div class="col-md-6">
                <div class="card p-4 text-center">

                    <h5>Risk Level</h5>

                    <h1 class="
                    {% if prediction in ['High', 'Very High'] %}risk-high
                    {% elif prediction == 'Medium' %}risk-medium
                    {% else %}risk-low
                    {% endif %}
                ">
                        {{ prediction }}
                    </h1>

                    <hr>

                    <h5>Confidence</h5>

                    <div class="progress mt-3">
                        <div class="progress-bar 
                        {% if prediction in ['High', 'Very High'] %}bg-danger
                        {% elif prediction == 'Medium' %}bg-warning
                        {% else %}bg-success
                        {% endif %}
                    " style="width: {{ confidence * 100 }}%">
                            {{ (confidence * 100)|round(1) }}%
                        </div>
                    </div>

                    <hr>

                    <h6>Model: {{ model }}</h6>

                </div>
            </div>

            <!-- MAP -->
            <div class="col-md-6">
                <div class="card p-3">
                    <h5 class="text-center">🌍 Location</h5>
                    <div id="map"></div>
                </div>
            </div>

        </div>

        <div class="text-center mt-4">
            <a href="/" class="btn btn-secondary">🔁 Try Again</a>
        </div>

    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script>
        var lat = {{ lat }};
        var lon = {{ lon }};
        var risk = "{{ prediction }}";

        var color = "green";

        if (risk === "High" || risk === "Very High") {
            color = "red";
        } else if (risk === "Medium") {
            color = "orange";
        }

        var map = L.map('map').setView([lat, lon], 5);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        L.circleMarker([lat, lon], {
            color: color,
            radius: 10
        }).addTo(map)
            .bindPopup(
                "<b>Risk:</b> " + risk + "<br><b>Confidence:</b> " + ({{ confidence }} * 100).toFixed(1) + "%"
    )
    .openPopup();
    </script>

</body>

</html>
